<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Find out where in the world it's 5 o'clock right now and discover delicious regional drink recipes!">
	<title>It's 5 o'clock...where?</title>
	
	<!-- external CSS -->
	<link rel="stylesheet" href="css/reset.css">
	<link type="text/css" rel="stylesheet" href="css/main.css">
	<link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
	
	<!-- external JS -->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
	<script src="js/jquery.flip.min.js"></script>
	<script type="text/javascript" src="js/main.js"></script>
	<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCaqtq7aOCU5Qoe_zUt1Y9S2mDICzBiLys&callback=initMap&loading=async" type="text/javascript"></script>
	
	<!-- Favicon -->
	<link rel="icon" href="favicon.ico" type="image/x-icon"/>
	<link rel="shortcut icon" href="favicon.ico" type="image/x-icon"/>
</head>
<body>
	<header>
		<div class="logo_container">
			<img src="./images/martini.png" alt="Martini glass" id="logo">
		</div>
		<h1 class="title">It's 5 o'clock...where?</h1>
		<div class="logo_container"></div>
	</header>
		
	<!-- city and time containers -->
	<main class="container">
		<div id="city-time-container">
			<div id="cityContainer">Loading location...</div>
			<div id="timeContainer">--:--:--</div>
		</div>
		
		<div id="map"></div>
		
		<!-- Featured Drink Recipe Section -->
		<section class="drink-suggest" id="drink-suggest-section">
			<h2 class="section-heading">Featured Drink Recipe</h2>
			<div id="recipe-card-container"></div>
		</section>
	</main>
	
	<footer class="footer">
		<p>Copyright 2017–2026. Christine Purdy.</p>
	</footer>
</body>
</html>
